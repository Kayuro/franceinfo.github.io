<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Franceinfo Live</title>
<meta property="og:title" content="🔴 Franceinfo en direct">
<meta property="og:description" content="Ouvrir le direct TV franceinfo">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kayuro.github.io/franceinfo.github.io/">
<meta property="og:image" content="https://www.franceinfo.fr/assets/common/images/logos/placeholder-4e7f49f2.png">
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0b0f14;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh
}
.card{
width:min(920px,92vw);
background:#111822;
border:1px solid rgba(255,255,255,.08);
border-radius:18px;
padding:24px;
box-shadow:0 20px 60px rgba(0,0,0,.45)
}
.badge{
display:inline-block;
background:#ff2b2b;
color:#fff;
font-weight:700;
padding:8px 14px;
border-radius:10px;
margin-bottom:18px
}
h1{
margin:0 0 10px;
font-size:32px
}
p{
margin:0 0 20px;
color:#c9d1d9;
line-height:1.5
}
.frame{
position:relative;
width:100%;
aspect-ratio:16/9;
border-radius:14px;
overflow:hidden;
background:#000
}
iframe{
width:100%;
height:100%;
border:0
}
.actions{
margin-top:18px;
display:flex;
gap:12px;
flex-wrap:wrap
}
a.btn{
text-decoration:none;
color:#fff;
background:#1f6feb;
padding:12px 16px;
border-radius:12px;
font-weight:700
}
a.btn.secondary{
background:#222b36
}
</style>
</head>
<body>
<div class="card">
<div class="badge">🔴 EN DIRECT</div>
<h1>Franceinfo Live</h1>
<p>Lecture dans le navigateur ci-dessous. Pour Discord, partage directement le lien YouTube officiel pour obtenir le meilleur résultat.</p>
<div class="frame">
<iframe src="https://www.youtube-nocookie.com/embed/NG7ZX42nZKc" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
</div>
<div class="actions">
<a class="btn" href="https://www.youtube.com/watch?v=NG7ZX42nZKc" target="_blank" rel="noopener noreferrer">Ouvrir sur YouTube</a>
<a class="btn secondary" href="https://www.franceinfo.fr/en-direct/tv.html" target="_blank" rel="noopener noreferrer">Page officielle franceinfo</a>
</div>
</div>
</body>
</html>
